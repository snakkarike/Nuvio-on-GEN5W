plugins {
    id 'com.android.application'
}

android {
    namespace 'org.nuvio.gen5w'
    compileSdkVersion 33

    defaultConfig {
        applicationId "org.nuvio.gen5w"
        minSdkVersion 19
        targetSdkVersion 19
        versionCode 2
        versionName "1.0.1"

        ndk {
            abiFilters "armeabi-v7a", "armeabi", "x86"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    // Modern TLS engine for Android 4.4 KitKat (BoringSSL with modern cipher suites)
    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    // ExoPlayer 2.14.2 - Stable release supporting Android 4.4 KitKat (minSdk 16), hosted on Maven Central
    implementation 'com.google.android.exoplayer:exoplayer-core:2.14.2'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.14.2'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.14.2'
}

